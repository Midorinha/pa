<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       var i = 1;

do {
    if (i % 10 === 0) {
        console.log(i + " - Múltiplo de 10");
    } else {
        console.log(i);
    }
    i++;
} while (i <= 100); 
    </script>
</body>
</html>
