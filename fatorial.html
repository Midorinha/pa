<!DOCTYPE html>
<html>
<head>
    <title>Questão C</title>
</head>
<body>

<script>
    let numero = Number(prompt("Digite um número inteiro:"));
    let fatorial = 1;
    let contador = 1;

    while (contador <= numero) {
        fatorial = fatorial * contador;
        contador++;
    }

    document.write("O fatorial de " + numero + " é " + fatorial);
</script>

</body>
</html>
