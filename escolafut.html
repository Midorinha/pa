<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var idade = Number(prompt("Digite a idade do aluno:"));

switch (idade) {
    case 6:
        document.write("Categoria: Dente de leite");
        break;

    case 7:
        document.write("Categoria: Júnior");
        break;

    case 8:
        document.write("Categoria: Júnior Max");
        break;

    case 9:
        document.write("Categoria: Júnior Master");
        break;

    case 10:
        document.write("Categoria: Master");
        break;

    default:
        document.write("Idade não aceita pela escola.");
}
    </script>
</body>
</html>
