<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var resp = 1;

do {
    var aa = parseInt(prompt("Digite o ano atual:"));
    var an = parseInt(prompt("Digite o ano de nascimento:"));
    
    var id = aa - an;
    console.log("A idade é: " + id);
    
    if (id < 18) {
        console.log("Menor de idade");
    } else {
        console.log("Maior de idade");
    }
    
    resp = parseInt(prompt("Deseja continuar? (1-SIM / 2-NÃO)"));
} while (resp === 1);
    </script>
</body>
</html>
